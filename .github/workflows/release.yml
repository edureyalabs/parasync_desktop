# .github/workflows/release.yml
# Pushing a version tag (v0.1.1, v0.2.0, ...) builds the Windows installer and publishes it as a GitHub Release.
# Installed apps pick the new release up on their own (electron-updater reads the release's latest.yml).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}. Use 'npm version' to bump and tag together."
            exit 1
          fi

      # "Run workflow" from the Actions page has no tag, and GitHub refuses to publish a release without one.
      # Create v<version> on this commit if it does not exist yet (a tag push already has it, so this is skipped).
      - name: Create the version tag if missing
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; building and publishing against it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Package and publish the installer
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
